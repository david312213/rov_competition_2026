# 永久沉底蛇形盲抓入口的参数模板。
# 当前已写入2026-09-17实艇标定的臂爪通道、PWM和动作时间，
# 以及2026-09-18指定的全部运动功率1.0。
# 复制到根目录 config/blind_grab.local.yaml 后可按现场距离微调时间。
# 启动前由操作员设置飞控模式并解锁；启动后立即下潜。

vertical:
  # 首次启动：持续下潜，压力深度稳定3秒即判底；10秒仍未确认也直接抓取。
  initial_descent_command: -1.00
  initial_bottom_stable_s: 3.0
  initial_bottom_tolerance_m: 0.05
  initial_minimum_descent_m: 0.10
  initial_fallback_s: 10.0
  # 每次投放后固定上潜2秒，再沿蛇形移动。
  ascent_command: 1.00
  ascent_duration_s: 2.0
  # 除第一次外，每次移动结束后固定下潜5秒。
  repeat_descent_command: -1.00
  repeat_descent_duration_s: 5.0

route:
  # 每带四段，每段前进5秒，总计20秒。
  forward_command: 1.00
  step_duration_s: 5.0
  steps_per_lane: 4
  # 第四段后先横移再转艇，左右方向逐带交替。
  shift_command: 1.00
  shift_duration_s: 4.5
  turn_command: 1.00
  turn_duration_s: 11.5

grab:
  forward_command: 1.00
  advance_duration_s: 1.0
  # 转到筐上方后开爪，保持这么久再让机械臂回位。
  release_duration_s: 2.0

actions:
  # output_channel 是飞控绝对 SERVO 编号，不会自动加 8。
  # 2026-09-17 实艇复核：QGC servo_3（按钮9/10）是夹爪，对应 S11；
  # QGC servo_2（按钮14/15）是机械臂，对应 S10；S10=1300为水平参考。
  open_gripper:
    duration_s: 0.5
    outputs:
      - output_channel: 11
        pwm: 730
  close_gripper:
    duration_s: 0.5
    outputs:
      - output_channel: 11
        pwm: 575
  arm_to_basket:
    duration_s: 1.8
    outputs:
      - output_channel: 10
        pwm: 1810
  arm_to_grasp:
    duration_s: 2.0
    outputs:
      - output_channel: 10
        pwm: 710

mavlink:
  connection_uri: "udpin:0.0.0.0:14551"
  baud: 115200
  source_system: 255
  source_component: 191
  target_system: 1
  target_component: 1
  directions:
    forward: 1
    lateral: 1
    vertical: 1
    yaw: 1

official_ros:
  enabled: true
  server_ip: "api.bjetone.com"
  # 一队40198；二队ddhyzx2为40197。模板默认二队，正式使用队伍启动脚本覆盖。
  server_port: 40197
  command_rate_hz: 20.0
  robot_data_rate_hz: 5.0
  telemetry_stale_s: 5.0
  forwarder_restart_s: 2.0
  # 首次沉底判定和官方数据显示共用同一份真实MAVLink深度。
  depth:
    message: "AHRS2"
    field: "altitude"
    multiplier: -1.0
    offset_m: 0.0

vision:
  target_labels: ["scallop"]
  confidence: 0.18
  # 感知仅绘制和显示框；检测结果永远不参与运动状态转换。
  start_helpers: true
  show_viewer: true
  record_video: false
  source_port: 5700
  inference_port: 5702
  record_port: 5704
  robot_config: null
  autonomy_config: null
