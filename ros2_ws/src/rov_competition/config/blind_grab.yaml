# 持续盲抓入口的唯一参数模板。
# 当前已写入2026-09-17实艇标定的臂爪通道、PWM和动作时间。
# 复制到根目录 config/blind_grab.local.yaml 后可按现场距离微调时间。
# 启动前由操作员完成作业高度、飞控模式与解锁；启动即开始搜索。

trigger:
  required_boxes: 4
  confirmation_frames: 5
  confirmation_duration_s: 1.0
  # 检测流曾经正常出帧后，连续这么久没有新帧就立即锁定永久盲抓。
  missing_frame_timeout_s: 1.0
  # 只统计搜索和停车确认时间；到时 4 直接变成 0。
  fallback_after_s: 30.0

search:
  # 原蛇形入口每次询问的“每带前进秒数”；目前先按20秒执行。
  lane_forward_duration_s: 20.0
  forward_command: 0.23
  shift_command: 0.20
  shift_duration_s: 4.5
  turn_command: 0.20
  turn_duration_s: 11.5

grab:
  grabs_per_batch: 10
  forward_command: 0.23
  advance_duration_s: 1.0
  # 转到筐上方后开爪，保持这么久再让机械臂回位。
  release_duration_s: 2.0

actions:
  # output_channel 是飞控绝对 SERVO 编号，不会自动加 8。
  # 一次动作需要多路舵机时，在 outputs 中追加条目。
  # 2026-09-17 实艇复核：QGC servo_3（按钮9/10）是夹爪，对应 S11；
  # QGC servo_2（按钮14/15）是机械臂，对应 S10；S10=1300为水平参考。
  open_gripper:
    duration_s: 0.5
    outputs:
      - output_channel: 11
        pwm: 730
  close_gripper:
    duration_s: 0.5
    outputs:
      - output_channel: 11
        pwm: 575
  arm_to_basket:
    duration_s: 1.8
    outputs:
      - output_channel: 10
        pwm: 1810
  arm_to_grasp:
    duration_s: 2.0
    outputs:
      - output_channel: 10
        pwm: 710

mavlink:
  connection_uri: "udpin:0.0.0.0:14551"
  baud: 115200
  source_system: 255
  source_component: 191
  # 如果实艇地址不是 1/1，填写实艇的 MAVLink system/component ID。
  target_system: 1
  target_component: 1
  directions:
    forward: 1
    lateral: 1
    vertical: 1
    yaw: 1

official_ros:
  # 默认启动官方 ros2_topic_forwarding，并独立重启；转发失败不停止盲抓。
  enabled: true
  server_ip: "api.bjetone.com"
  # 来自本次官方包 forwarding.yaml。若平台重新分配端口，只改本地配置。
  server_port: 40184
  command_rate_hz: 20.0
  robot_data_rate_hz: 5.0
  telemetry_stale_s: 5.0
  forwarder_restart_s: 2.0
  # 与现有实艇遥测定义一致：AHRS2.altitude 取负数作为深度（米）。
  depth:
    message: "AHRS2"
    field: "altitude"
    multiplier: -1.0
    offset_m: 0.0

vision:
  target_labels: ["scallop"]
  # 本值也写入本次独立感知配置，避免上游仍用 0.45 先过滤目标。
  confidence: 0.18
  # 已经另行启动了视频分发和感知时设 false，仍订阅 /rov/detections。
  start_helpers: true
  show_viewer: true
  record_video: false
  source_port: 5700
  inference_port: 5702
  record_port: 5704
  # 这两个 null 表示使用本包同名配置；也可填实艇配置的绝对路径。
  robot_config: null
  autonomy_config: null
