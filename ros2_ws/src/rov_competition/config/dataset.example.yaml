# ROV 水池数据集采集配置
#
# 首次使用时，一键脚本会把本文件复制为 config/dataset.yaml。
# 键盘采集不设置软件深度上限；深度仅用于显示和可选的按 0 回收。

manual_control:
  # W/A/S/D、1/2 和上下方向键的归一化运动指令。
  # 0.10 实测位于推进器死区附近。默认仍从 0.20 起步，
  # 操作员确认方向与停车正常后，才可逐级增加到 0.80。
  initial_command: 0.20
  minimum_command: 0.05
  maximum_command: 0.80
  command_step: 0.05
  publish_rate_hz: 20.0

recovery:
  # 启动和结束时都有有效深度才回到启动深度；否则直接回中上锁。
  gain: 0.50
  maximum_command: 0.20
  tolerance_m: 0.05
  settle_s: 1.0
  timeout_s: 60.0

safety:
  maximum_telemetry_age_s: 1.50
  # 网关正常每 0.2 秒发布一次；给桌面调度和 DDS 回调队列留出余量。
  maximum_status_age_s: 3.0
  # ATTITUDE 偶发丢包时继续使用飞控自身的 ALT_HOLD；连续 5 秒无有效
  # 姿态才中止。心跳断链仍按 robot.yaml 的更短阈值优先停车。
  maximum_attitude_age_s: 5.0
  allowed_flight_mode: "ALT_HOLD"
